<!--
  ==========================================================================
  WOCHENPLAN
  Version: 1.4.2
  Datum:   2026-11-25

  Ein Wochenplan für Abendessen und Mittagssalat. Gekocht wird in Runden
  (zwei Gerichte für mehrere Abende), der Planer achtet auf Abwechslung
  bei Eiweißquellen, Beilagen, Gemüse und Küchen.

  Änderungslog
  1.4.2  Neues Icon: Teller mit Besteck.
  1.4.1  Seltene Zutaten: Gerichte mit Avocado kommen seltener dran.
  1.4.0  Genuss zum Wochenende: Pasta, Käseabend und Pizza bekommen am
         Wochenende Bonuspunkte. Käseabend und Pizza nur samstags (Platz D),
         ohne Kochen und ohne Reste. Pizza zählt nicht zur Vielfalt.
  1.3.1  Ei aus den Salat-Toppings entfernt.
  1.3.0  Favoriten: Stern auf jeder Karte und in der Liste aller Gerichte,
         Favoriten bekommen Bonuspunkte. Druckansicht: Wochenplan auf
         einer A4-Seite, als PDF speicherbar. Datenstand 2 mit Migration.
  1.2.0  Abendgerichte der Vorwoche sind ausgeschlossen (außer gesperrt).
         Familien ähnlicher Gerichte: höchstens eins pro Woche, gleiche
         Familie wie in der Vorwoche kostet Punkte.
  1.1.0  Daten nach euren echten Rezepten: Serbische Bohnen ohne Tomate,
         Halloumicurry mit Spinat (Blattgrün), Bulgur mit Kichererbsen,
         Linsenbolo mit Walnüssen, Burritos und weitere Gerichte angepasst.
  1.0.0  Erste Fassung: Plan für 7 Tage mit zwei Kochrunden und zwei
         Salatbasen, Regeln für Vielfalt, Tomatenbremse, Blattgrün
         verteilen, Cooldown über die Vorwochen, Sperren, Tauschen,
         Neu würfeln, Rückgängig, Wochen-Check mit Begründungen.

  Gerichte ergänzen: im Block DATEN eine Zeile kopieren und anpassen.
  In Squarespace einbetten: nur den Bereich zwischen EINBETTEN: AB HIER
  und EINBETTEN: BIS HIER in einen Code-Block kopieren.
  ==========================================================================
-->

<style>
  /* Alle Stile hängen an .wpl, damit eine Website und das Tool sich nicht
     gegenseitig verändern. */
  .wpl {
    --bg: #f6f4ef;
    --surface: #ffffff;
    --text: #1f1d1a;
    --muted: #57534c;
    --line: #d6d0c4;
    --accent: #3d5a4a;
    --on-accent: #ffffff;
    --soft: #e7eee8;
    --focus: #b0601a;
    --error: #8a2e2e;
    --radius: 12px;
    --tap: 44px;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;

    color-scheme: light dark;
    box-sizing: border-box;
    max-width: 40rem;
    margin: 0 auto;
    padding: 1.5rem 1rem 6rem;   /* unten Platz für die Statusleiste */
    padding-left: max(1rem, env(safe-area-inset-left));
    padding-right: max(1rem, env(safe-area-inset-right));
    font-family: var(--font);
    font-size: 1.0625rem;
    line-height: 1.5;
    color: var(--text);
    background: var(--bg);
  }
  @media (prefers-color-scheme: dark) {
    .wpl {
      --bg: #1b1a18;
      --surface: #25231f;
      --text: #ece8e1;
      --muted: #b5afa5;
      --line: #3d3a33;
      --accent: #8fb39e;
      --on-accent: #12201a;
      --soft: #2c3a31;
      --focus: #e0a96d;
      --error: #eba3a3;
    }
  }
  .wpl *, .wpl *::before, .wpl *::after { box-sizing: inherit; }

  .wpl h1 { font-size: 1.6rem; line-height: 1.2; margin: 0 0 .25rem; font-weight: 650; }
  .wpl h2 { font-size: 1.15rem; margin: 2rem 0 .75rem; font-weight: 650; }
  .wpl h3 { font-size: 1rem; margin: 1.25rem 0 .5rem; color: var(--muted); font-weight: 600; }
  .wpl .wpl-sub { margin: 0 0 1.25rem; color: var(--muted); }
  .wpl p { margin: 0; }

  .wpl .wpl-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 1rem 1.1rem;
    margin-bottom: .75rem;
  }

  /* Wochenübersicht */
  .wpl .wpl-day { display: grid; grid-template-columns: 3.6rem 1fr; gap: .25rem .75rem; padding: .85rem 0; border-top: 1px solid var(--line); }
  .wpl .wpl-day:first-child { border-top: 0; padding-top: 0; }
  .wpl .wpl-day:last-child { padding-bottom: 0; }
  .wpl .wpl-dayname { font-weight: 650; line-height: 1.3; }
  .wpl .wpl-dayname small { display: block; font-weight: 400; color: var(--muted); font-size: .85rem; }
  .wpl .wpl-meal { display: flex; gap: .5rem; align-items: baseline; }
  .wpl .wpl-meal-label { color: var(--muted); font-size: .9rem; min-width: 3.4rem; }
  .wpl .wpl-hint { font-size: .9rem; color: var(--muted); margin-top: .15rem; }

  function isValidPlan(p) {
    if (!p || typeof p !== 'object') return false;
    if (!p.abend || !p.mittag || typeof p.seed !== 'number') return false;
    if (!p.locks || typeof p.locks !== 'object' || !p.getauscht || typeof p.getauscht !== 'object') return false;
    return ABEND_SLOTS.every(function (s) { return findDish(DATEN.abend, p.abend[s]); }) &&
           MITTAG_SLOTS.every(function (s) { return findDish(DATEN.mittag, p.mittag[s]); });
  }

  // Liest gespeicherte Daten und wirft nur einzelne kaputte Wochen weg, nicht alles
  function sanitize(s) {
    if (!s || typeof s !== 'object' || s.v !== CONFIG.schemaVersion) return defaultState();
    if (!s.wochen || typeof s.wochen !== 'object' || Array.isArray(s.wochen)) return defaultState();
    const clean = defaultState();
    Object.keys(s.wochen).forEach(function (k) {
      if (/^\d{4}-\d{2}-\d{2}$/.test(k) && isValidPlan(s.wochen[k])) clean.wochen[k] = s.wochen[k];
    });
    // Nur Favoriten behalten, deren Gericht es noch gibt
    if (Array.isArray(s.favoriten)) {
      clean.favoriten = uniq(s.favoriten.filter(function (id) {
        return typeof id === 'string' && (findDish(DATEN.abend, id) || findDish(DATEN.mittag, id));
      }));
    }
    return clean;
  }

  function migrate(s) {
    if (!s || typeof s !== 'object' || typeof s.v !== 'number') return null;
    if (s.v > CONFIG.schemaVersion) return null;
    // Stand 1 kannte noch keine Favoriten: Feld ergänzen, Wochen bleiben erhalten
    if (s.v === 1) { s.favoriten = []; s.v = 2; }
    return s;
  }

  function clone(obj) { return JSON.parse(JSON.stringify(obj)); }

  const storage = {
    available: (function () {
      try {
        const k = '__wpl_test__';
        window.localStorage.setItem(k, k);
        window.localStorage.removeItem(k);
        return true;
      } catch (e) { return false; }
    })(),
    load: function () {
      if (!this.available) return defaultState();
      try {
        const raw = window.localStorage.getItem(CONFIG.storageKey);
        if (!raw) return defaultState();
        return sanitize(migrate(JSON.parse(raw)));
      } catch (e) {
        return defaultState();
      }
    },
    save: function (s) {
      if (!this.available) return;
      try { window.localStorage.setItem(CONFIG.storageKey, JSON.stringify(s)); }
      catch (e) { /* Speicher voll: Tool läuft trotzdem */ }
    }
  };

  /* ======================================================================
     5. LOGIK
     Reine Funktionen ohne Zugriff auf die Seite.
     ====================================================================== */

  // --- Datum ---------------------------------------------------------------
  // Wochentag ab Montag: 0 = Mo ... 6 = So (JavaScript zählt ab Sonntag)
  function wochentag(d) { return (d.getDay() + 6) % 7; }

  function addDays(d, n) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }

  function dateKey(d) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  function keyToDate(k) {
    const p = k.split('-').map(Number);
    return new Date(p[0], p[1] - 1, p[2]);
  }

  // Welche Woche zeigt das Tool? Ab Samstag schon die kommende, damit der
  // Plan am Sonntagabend für die neue Woche bereitsteht.
  function zielMontag(heute, abTag) {
    const montag = addDays(heute, -wochentag(heute));
    return wochentag(heute) >= abTag ? addDays(montag, 7) : montag;
  }

  // Abstand in Wochen. Über UTC gerechnet, damit die Zeitumstellung nicht stört.
  function wochenAbstand(kNeu, kAlt) {
    const a = kNeu.split('-').map(Number), b = kAlt.split('-').map(Number);
    return Math.round((Date.UTC(a[0], a[1] - 1, a[2]) - Date.UTC(b[0], b[1] - 1, b[2])) / (7 * 864e5));
  }

  // --- Plan lesen -----------------------------------------------------------
  function planIds(plan) {
    return ABEND_SLOTS.map(function (s) { return plan.abend[s]; })
      .concat(MITTAG_SLOTS.map(function (s) { return plan.mittag[s]; }));
  }

  // Liefert pro Slot das Gericht-Objekt
  function resolve(plan) {
    const r = {};
    ABEND_SLOTS.forEach(function (s) { r[s] = findDish(DATEN.abend, plan.abend[s]); });
    MITTAG_SLOTS.forEach(function (s) { r[s] = findDish(DATEN.mittag, plan.mittag[s]); });
    return r;
  }

  // Die Paare, in denen Kontrast gewünscht ist: jede Kochrunde und die beiden Salate
  function paare() {
    return CONFIG.kochrunden.map(function (r) { return r.slots; }).concat([MITTAG_SLOTS]);
  }

  function gruppe(quelle) { return CONFIG.eiweissGruppen[quelle] || quelle; }

  function uniq(arr) { return arr.filter(function (x, i) { return arr.indexOf(x) === i; }); }

  function familieIn(liste, id) {
    const d = findDish(liste, id);
    return d && d.familie ? d.familie : null;
  }

  // Manche Gerichte gehören nur auf bestimmte Plätze, z. B. Käseabend auf Samstag
  function passtAufSlot(x, slot) { return !x.nurSlots || x.nurSlots.indexOf(slot) !== -1; }

  // Abendgerichte der direkten Vorwoche: diese sind diese Woche tabu
  function verbotenFuer(hist) {
    if (!CONFIG.vorwocheAusschliessen) return [];
    return [].concat.apply([], hist.filter(function (h) { return h.abstand === 1; }).map(function (h) { return h.ids; }))
      .filter(function (id) { return findDish(DATEN.abend, id); });
  }

  // Gedächtnis: welche Gerichte in den Wochen vor der Zielwoche dran waren
  function historie(wochen, zielKey) {
    return Object.keys(wochen)
      .filter(function (k) { return k < zielKey; })
      .map(function (k) { return { abstand: wochenAbstand(zielKey, k), ids: planIds(wochen[k]) }; })
      .filter(function (h) { return h.abstand >= 1; });
  }

  function zuletztVor(hist, id) {
    let min = Infinity;
    hist.forEach(function (h) { if (h.ids.indexOf(id) !== -1 && h.abstand < min) min = h.abstand; });
    return min;
  }

  // --- Bewertung ------------------------------------------------------------
  // Gibt Punkte und die Kennzahlen zurück. Die Kennzahlen nutzt auch der
  // Wochen-Check, damit Anzeige und Auswahl nach denselben Regeln laufen.
  function bewerte(plan, hist, vorher, favs) {
    const g = CONFIG.gewichte;
    favs = favs || [];
    const d = resolve(plan);
    const abend = ABEND_SLOTS.map(function (s) { return d[s]; });
    // Bestelltes zählt nicht zur Vielfalt, sonst würde Pizza die Bilanz schönrechnen
    const alle = abend.concat(MITTAG_SLOTS.map(function (s) { return d[s]; })).filter(function (x) { return !x.zaehltNicht; });

    const quellen = uniq([].concat.apply([], alle.map(function (x) { return x.eiweiss; })));
    const gruppen = uniq(quellen.map(gruppe));
    const beilagen = uniq([].concat.apply([], alle.map(function (x) { return x.beilage; })));
    const pflanzen = uniq([].concat.apply([], alle.map(function (x) { return x.gemuese; })));
    const kuechen = uniq(abend.filter(function (x) { return !x.zaehltNicht && x.kueche; }).map(function (x) { return x.kueche; }));

    let punkte = gruppen.length * g.eiweissGruppe + quellen.length * g.eiweissQuelle +
                 beilagen.length * g.beilage + pflanzen.length * g.pflanze + kuechen.length * g.kueche;

    // Kontrast innerhalb eines Paares: wer zwei Abende im Wechsel isst, soll Unterschied schmecken
    paare().forEach(function (paar) {
      for (let i = 0; i < paar.length; i++) {
        for (let j = i + 1; j < paar.length; j++) {
          const a = d[paar[i]], b = d[paar[j]];
          if (a.eiweiss[0] && b.eiweiss[0] && gruppe(a.eiweiss[0]) === gruppe(b.eiweiss[0])) punkte -= g.paarGleichesEiweiss;
          if (a.kueche && a.kueche === b.kueche) punkte -= g.paarGleicheKueche;
          if (a.beilage.some(function (x) { return b.beilage.indexOf(x) !== -1; })) punkte -= g.paarGleicheBeilage;
        }
      }
    });

    CONFIG.genussSlots.forEach(function (s) { if (d[s] && d[s].genuss) punkte += g.genuss; });

    // Gerichte mit schwer erhältlichen Zutaten seltener einplanen
    alle.forEach(function (x) {
      x.gemuese.forEach(function (z) { if (CONFIG.selteneZutaten[z]) punkte -= CONFIG.selteneZutaten[z]; });
    });

    const tomate = abend.filter(function (x) { return x.tomatensauce; }).length;
    if (tomate > CONFIG.maxTomatensauce) punkte -= (tomate - CONFIG.maxTomatensauce) * g.tomateZuViel;

    // Blattgrün pro Tag zählen: Mittag und Abend aus den Mustern
    const gruenTage = [];
    for (let tag = 0; tag < 7; tag++) {
      let n = 0;
      const m = CONFIG.mittagMuster[tag], a = CONFIG.abendMuster[tag];
      if (m && d[m] && d[m].blattgruen) n++;
      if (a && d[a] && d[a].blattgruen) n++;
      if (n > 0) gruenTage.push(tag);
      if (CONFIG.blattgruenVerteilen && n > 1) punkte -= g.blattgruenGleicherTag;
    }

    // Gleiche Familie wie letzte Woche: erlaubt, aber teuer. Ein hartes Verbot
    // ließe bei vier Familien zu wenig Gerichte übrig.
    const famVorwoche = verbotenFuer(hist).map(function (id) { return familieIn(DATEN.abend, id); }).filter(Boolean);
    abend.forEach(function (x) { if (x.familie && famVorwoche.indexOf(x.familie) !== -1) punkte -= g.familieVorwoche; });

    planIds(plan).forEach(function (id) {
      const vor = zuletztVor(hist, id);
      if (vor <= CONFIG.cooldownStrafe.length) punkte -= CONFIG.cooldownStrafe[vor - 1];
      if (vorher && vorher.indexOf(id) !== -1) punkte -= CONFIG.strafeVorherigerWurf;
      if (favs.indexOf(id) !== -1) punkte += g.favorit;
    });

    return {
      punkte: punkte,
      quellen: quellen, gruppen: gruppen, beilagen: beilagen, pflanzen: pflanzen, kuechen: kuechen,
      tomate: tomate, gruenTage: gruenTage
    };
  }

  // Zufälliges Element aus einer Liste
  function pick(list, rand) { return list[Math.floor(rand() * list.length)]; }

  // Wählt zufällig unter allen Kandidaten nahe am besten Ergebnis.
  // Warum nicht einfach den besten: sonst käme bei jedem Würfeln dieselbe Woche.
  function waehleNaheBestem(kandidaten, rand) {
    let best = -Infinity;
    kandidaten.forEach(function (k) { if (k.punkte > best) best = k.punkte; });
    return pick(kandidaten.filter(function (k) { return k.punkte >= best - CONFIG.spielraum; }), rand);
  }

  // Füllt alle freien Slots eines Typs mit zufälligen, verschiedenen Gerichten.
  // Harte Regeln wirken hier, damit sie nie verletzt werden. Die Stufen danach
  // greifen nur, wenn es sonst kein Gericht mehr gäbe.
  function fuelle(slots, liste, fest, locks, verboten, rand) {
    const out = {};
    const belegt = [];
    slots.forEach(function (s) { if (locks[s] && fest && fest[s]) { out[s] = fest[s]; belegt.push(fest[s]); } });
    slots.forEach(function (s) {
      if (out[s]) return;
      const fams = belegt.map(function (id) { return familieIn(liste, id); }).filter(Boolean);
      const frei = function (x) { return belegt.indexOf(x.id) === -1; };
      const erlaubt = function (x) { return verboten.indexOf(x.id) === -1; };
      const neueFamilie = function (x) { return !CONFIG.eineProFamilie || !x.familie || fams.indexOf(x.familie) === -1; };
      const platz = function (x) { return passtAufSlot(x, s); };
      const stufen = [
        function (x) { return platz(x) && frei(x) && erlaubt(x) && neueFamilie(x); },
        function (x) { return platz(x) && frei(x) && erlaubt(x); },
        function (x) { return platz(x) && frei(x); },
        platz
      ];
      let pool = [];
      for (let i = 0; i < stufen.length && !pool.length; i++) pool = liste.filter(stufen[i]);
      const wahl = pick(pool, rand).id;
      out[s] = wahl;
      belegt.push(wahl);
    });
    return out;
  }

  // Baut eine Woche. Gesperrte Slots aus dem alten Plan bleiben stehen.
  function erzeugePlan(alt, hist, rand, favs) {
    const locks = alt ? clone(alt.locks) : {};
    const vorher = alt ? planIds(alt).filter(function (id, i) {
      const slot = ABEND_SLOTS.concat(MITTAG_SLOTS)[i];
      return !locks[slot];
    }) : null;
    const verboten = verbotenFuer(hist);
    const kandidaten = [];
    for (let i = 0; i < CONFIG.versuche; i++) {
      const plan = {
        abend: fuelle(ABEND_SLOTS, DATEN.abend, alt && alt.abend, locks, verboten, rand),
        mittag: fuelle(MITTAG_SLOTS, DATEN.mittag, alt && alt.mittag, locks, [], rand),
        locks: locks,
        getauscht: {},
        seed: Math.floor(rand() * 1000)
      };
      plan.punkte = bewerte(plan, hist, vorher, favs).punkte;
      kandidaten.push(plan);
    }
    const wahl = waehleNaheBestem(kandidaten, rand);
    delete wahl.punkte;
    return wahl;
  }

  function istMittag(slot) { return MITTAG_SLOTS.indexOf(slot) !== -1; }

  // Tauscht ein Gericht gegen das passendste andere. Bereits weggetauschte
  // kommen erst wieder, wenn alle durch sind.
  function tausche(plan, slot, hist, rand, favs) {
    const neu = clone(plan);
    const mittag = istMittag(slot);
    const feld = mittag ? 'mittag' : 'abend';
    const liste = DATEN[feld];
    const aktuell = neu[feld][slot];
    const imPlan = planIds(neu);
    const verboten = mittag ? [] : verbotenFuer(hist);
    const andereFam = mittag ? [] : ABEND_SLOTS.filter(function (s) { return s !== slot; })
      .map(function (s) { return familieIn(liste, neu.abend[s]); }).filter(Boolean);
    const passt = function (x, gesehen, streng) {
      if (!passtAufSlot(x, slot) || imPlan.indexOf(x.id) !== -1 || gesehen.indexOf(x.id) !== -1) return false;
      if (!streng) return true;
      return verboten.indexOf(x.id) === -1 &&
        !(CONFIG.eineProFamilie && x.familie && andereFam.indexOf(x.familie) !== -1);
    };
    // Erst streng mit Gedächtnis, dann streng von vorn, erst zuletzt ohne harte Regeln
    const bisher = (neu.getauscht[slot] || []).concat(aktuell);
    const versuche = [[bisher, true], [[aktuell], true], [bisher, false], [[aktuell], false]];
    let pool = [], gesehen = bisher;
    for (let i = 0; i < versuche.length && !pool.length; i++) {
      gesehen = versuche[i][0];
      pool = liste.filter(function (x) { return passt(x, versuche[i][0], versuche[i][1]); });
    }
    if (!pool.length) return null;   // es gibt schlicht kein anderes Gericht
    const kandidaten = pool.map(function (x) {
      const p = clone(neu);
      p[feld][slot] = x.id;
      return { id: x.id, punkte: bewerte(p, hist, null, favs).punkte };
    });
    neu[feld][slot] = waehleNaheBestem(kandidaten, rand).id;
    neu.getauscht[slot] = gesehen;
    return neu;
  }

  // --- Erklärungen ----------------------------------------------------------
  // Begründet in ein bis drei kurzen Sätzen, warum ein Gericht in dieser Woche steht
  function begruendung(plan, slot, hist, favs) {
    const d = resolve(plan);
    const g = d[slot];
    const andere = Object.keys(d).filter(function (s) { return s !== slot; }).map(function (s) { return d[s]; });
    const sammle = function (feld) { return [].concat.apply([], andere.map(function (x) { return x[feld]; })); };
    const saetze = [];

    if (plan.locks[slot]) saetze.push(t('rLocked'));
    if (favs && favs.indexOf(g.id) !== -1) saetze.push(t('rFav'));
    if (g.genuss && CONFIG.genussSlots.indexOf(slot) !== -1) saetze.push(t('rGenuss'));

    const neuDrin = g.eiweiss.concat(g.beilage).filter(function (x) {
      return sammle('eiweiss').concat(sammle('beilage')).indexOf(x) === -1;
    }).slice(0, 3);
    if (neuDrin.length) {
      saetze.push(t('rNew', { list: neuDrin.join(', ') }));
    } else {
      const pfl = g.gemuese.filter(function (x) { return sammle('gemuese').indexOf(x) === -1; }).slice(0, 3);
      if (pfl.length) saetze.push(t('rPlants', { list: pfl.join(', ') }));
    }

    const paar = paare().filter(function (p) { return p.indexOf(slot) !== -1; })[0] || [];
    const partnerSlot = paar.filter(function (s) { return s !== slot; })[0];
    if (partnerSlot) {
      const p = d[partnerSlot];
      const label = istMittag(partnerSlot) ? p.name : partnerSlot;
      if (g.kueche && p.kueche && g.kueche !== p.kueche) {
        saetze.push(t('rContrastKitchen', { slot: label, a: g.kueche, b: p.kueche }));
      } else if (g.eiweiss[0] && p.eiweiss[0] && gruppe(g.eiweiss[0]) !== gruppe(p.eiweiss[0])) {
        saetze.push(t('rContrastProtein', { slot: label, a: g.eiweiss[0], b: p.eiweiss[0] }));
      }
    }

    if (hist.length) {
      const vor = zuletztVor(hist, g.id);
      if (vor === 1) saetze.push(t('rAgo1'));
      else if (vor !== Infinity) saetze.push(t('rAgo', { n: vor }));
      else saetze.push(t('rLong'));
    }
    return saetze.join(' ');
  }

  // Wie viele Portionen bleiben übrig, wenn ein Gericht seltener auf dem Plan steht?
  function restPortionen(slot) {
    const abende = CONFIG.abendMuster.filter(function (s) { return s === slot; }).length;
    return Math.max(0, CONFIG.portionenProGericht - abende * CONFIG.personen);
  }

  // Prüft, ob ein Gericht länger als erlaubt im Kühlschrank stünde.
  // Greift nur, wenn jemand Muster oder Kochtage in CONFIG ändert.
  function frischeWarnungen() {
    const out = [];
    CONFIG.kochrunden.forEach(function (r) {
      r.slots.forEach(function (slot) {
        CONFIG.abendMuster.forEach(function (s, tag) {
          if (s === slot && tag - r.tag > CONFIG.maxTageNachKochen) out.push({ slot: slot, tage: tag - r.tag });
        });
      });
    });
    return out;
  }

  // Topping-Ideen rotieren mit dem Zufallswert der Woche, damit jede Woche anders beginnt
  function toppings(seed, tag) {
    const n = DATEN.toppings.length;
    const out = [];
    for (let i = 0; i < Math.min(CONFIG.toppingsProTag, n); i++) out.push(DATEN.toppings[(seed + tag * CONFIG.toppingsProTag + i) % n]);
    return out;
  }

  /* ======================================================================
     6. OBERFLÄCHE
     ====================================================================== */
  const root = document.getElementById('wpl-app');
  if (!root) return;

  let state;
  let zielKey;
  let undoSnapshot = null;
  let undoTimer = null;

  function esc(str) {
    return String(str).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function ref(name) { return root.querySelector('[data-ref="' + name + '"]'); }

  function datumKurz(d) { return d.getDate() + '.' + (d.getMonth() + 1) + '.'; }

  function aktuellerPlan() { return state.wochen[zielKey]; }

  function buildSkeleton() {
    root.setAttribute('lang', CONFIG.lang);
    root.innerHTML =
      '<h1>' + esc(t('title')) + '</h1>' +
      '<p class="wpl-sub" data-ref="range"></p>' +
      '<div data-ref="warn"></div>' +
      '<h2>' + esc(t('secWeek')) + '</h2>' +
      '<div class="wpl-card" data-ref="week"></div>' +
      '<button type="button" data-action="print">' + esc(t('print')) + '</button>' +
      '<p class="wpl-small">' + esc(t('printHint')) + '</p>' +
      '<h2>' + esc(t('secDishes')) + '</h2>' +
      '<button type="button" class="wpl-primary" data-action="reroll">' + esc(t('reroll')) + '</button>' +
      '<p class="wpl-small">' + esc(t('rerollHint')) + '</p>' +
      '<div data-ref="dishes"></div>' +
      '<h2>' + esc(t('secCheck')) + '</h2>' +
      '<div class="wpl-card" data-ref="check"></div>' +
      '<details class="wpl-all"><summary>' + esc(t('allDishes')) + '</summary><div data-ref="all"></div></details>' +
      '<div class="wpl-print" data-ref="print" aria-hidden="true"></div>' +
      '<div class="wpl-status" data-ref="status" role="status" aria-live="polite"></div>' +
      (CONFIG.showDisclaimer ? '<p class="wpl-footer">' + esc(t('disclaimer')) + '</p>' : '');
  }

  function renderWeek(plan, d) {
    const montag = keyToDate(zielKey);
    const tage = t('days');
    let html = '';
    for (let tag = 0; tag < 7; tag++) {
      const datum = addDays(montag, tag);
      const m = CONFIG.mittagMuster[tag];
      const a = CONFIG.abendMuster[tag];
      const todos = [];
      CONFIG.kochrunden.forEach(function (r) {
        if (r.tag !== tag) return;
        const kochen = r.slots.filter(function (s) { return !d[s].einAbend; });
        if (kochen.length) todos.push(t('todoCook', { list: kochen.join(' und ') }));
      });
      CONFIG.salatrunden.forEach(function (r) {
        if (r.tag === tag) todos.push(t('todoSalad', { n: CONFIG.mittagMuster.filter(function (s) { return s === r.slot; }).length }));
      });
      html +=
        '<div class="wpl-day">' +
          '<div class="wpl-dayname">' + esc(tage[tag]) + '<small>' + esc(datumKurz(datum)) + '</small></div>' +
          '<div>' +
            '<div class="wpl-meal"><span class="wpl-meal-label">' + esc(t('lunch')) + '</span><span>' +
              (m ? esc(d[m].name) + '<div class="wpl-hint">' + esc(t('toppingIdea', { list: toppings(plan.seed, tag).join(', ') })) + '</div>' : esc(t('free'))) +
            '</span></div>' +
            '<div class="wpl-meal"><span class="wpl-meal-label">' + esc(t('dinner')) + '</span><span>' +
              (a ? '<span class="wpl-badge" aria-hidden="true">' + esc(a) + '</span> ' + esc(d[a].name) : esc(t('free'))) +
            '</span></div>' +
            todos.map(function (x) { return '<span class="wpl-todo">' + esc(x) + '</span> '; }).join('') +
          '</div>' +
        '</div>';
    }
    ref('week').innerHTML = html;
  }

  function dishCard(plan, d, slot, hist) {
    const istFav = state.favoriten.indexOf(d[slot].id) !== -1;
    const g = d[slot];
    const locked = !!plan.locks[slot];
    const rest = istMittag(slot) || g.einAbend ? 0 : restPortionen(slot);
    return '<div class="wpl-card">' +
      '<div class="wpl-dish-head"><span class="wpl-badge' + (istMittag(slot) ? ' is-salad' : '') + '" aria-hidden="true">' +
        esc(istMittag(slot) ? String(MITTAG_SLOTS.indexOf(slot) + 1) : slot) + '</span>' +
        '<span class="wpl-dish-name">' + esc(g.name) + '</span></div>' +
      '<p class="wpl-keys">' + esc(g.zutaten.join(', ')) + '</p>' +
      '<p class="wpl-reason">' + esc(begruendung(plan, slot, hist, state.favoriten)) + '</p>' +
      (rest > 0 ? '<p class="wpl-hint">' + esc(t('rest', { n: rest })) + '</p>' : '') +
      '<div class="wpl-actions">' +
        '<button type="button" data-action="lock" data-slot="' + esc(slot) + '" aria-pressed="' + locked + '">' +
          esc(locked ? t('locked') : t('lock')) + '</button>' +
        '<button type="button" data-action="swap" data-slot="' + esc(slot) + '"' + (locked ? ' disabled' : '') + '>' + esc(t('swap')) + '</button>' +
        favButton(g.id, istFav) +
      '</div>' +
    '</div>';
  }

  function renderDishes(plan, d, hist) {
    const tage = t('days');
    let html = '';
    CONFIG.kochrunden.forEach(function (r) {
      html += '<h3>' + esc(t('roundCook', { tag: tage[r.tag] })) + '</h3>';
      r.slots.forEach(function (s) { html += dishCard(plan, d, s, hist); });
    });
    CONFIG.salatrunden.forEach(function (r) {
      html += '<h3>' + esc(t('roundSalad', { tag: tage[r.tag] })) + '</h3>';
      html += dishCard(plan, d, r.slot, hist);
    });
    ref('dishes').innerHTML = html;
  }

  function checkRow(ok, text, detail) {
    return '<div class="wpl-check"><span class="wpl-check-mark' + (ok ? '' : ' is-open') + '" aria-hidden="true">' + (ok ? '✓' : '○') + '</span>' +
      '<span>' + esc(text) + '</span>' +
      (detail ? '<span class="wpl-check-detail">' + esc(detail) + '</span>' : '') + '</div>';
  }

  function renderCheck(plan, hist) {
    const b = bewerte(plan, hist, null);
    const z = CONFIG.ziele;
    const tage = t('days');
    const gruen = b.gruenTage.map(function (i) { return tage[i]; });
    ref('check').innerHTML =
      checkRow(b.gruppen.length >= z.eiweissGruppen, t('cProtein', { n: b.gruppen.length }), b.quellen.join(', ')) +
      checkRow(b.beilagen.length >= z.beilagen, t('cSides', { n: b.beilagen.length }), b.beilagen.join(', ')) +
      checkRow(b.pflanzen.length >= z.pflanzen, t('cPlants', { n: b.pflanzen.length }), b.pflanzen.join(', ')) +
      checkRow(b.kuechen.length >= z.kuechen, t('cKitchen', { n: b.kuechen.length }), b.kuechen.join(', ')) +
      checkRow(b.tomate <= CONFIG.maxTomatensauce, t('cTomato', { n: b.tomate, max: CONFIG.maxTomatensauce }), '') +
      (CONFIG.blattgruenVerteilen
        ? checkRow(true, gruen.length ? t('cGreen', { list: gruen.join(', ') }) : t('cGreenNone'), t('cGreenSpread'))
        : '');
  }

  function favButton(id, aktiv) {
    return '<button type="button" data-action="fav" data-id="' + esc(id) + '" aria-pressed="' + aktiv + '">' +
      esc(aktiv ? t('favOn') : t('fav')) + '</button>';
  }

  // Liste aller Gerichte, damit auch Gerichte außerhalb des Plans Favorit werden können
  function renderAll() {
    const zeile = function (x) {
      return '<div class="wpl-row"><span>' + esc(x.name) + '</span>' + favButton(x.id, state.favoriten.indexOf(x.id) !== -1) + '</div>';
    };
    ref('all').innerHTML =
      '<h3>' + esc(t('allDinner')) + '</h3>' + DATEN.abend.map(zeile).join('') +
      '<h3>' + esc(t('allLunch')) + '</h3>' + DATEN.mittag.map(zeile).join('');
  }

  // Druckansicht: liegt unsichtbar bereit, nur @media print zeigt sie.
  // Eigener schlichter Aufbau statt der Bildschirmkarten, damit alles auf eine Seite passt.
  function renderPrint(plan, d, hist) {
    const montag = keyToDate(zielKey);
    const tage = t('days');
    let rows = '';
    for (let tag = 0; tag < 7; tag++) {
      const m = CONFIG.mittagMuster[tag], a = CONFIG.abendMuster[tag];
      const todos = [];
      CONFIG.kochrunden.forEach(function (r) {
        if (r.tag !== tag) return;
        const kochen = r.slots.filter(function (s) { return !d[s].einAbend; });
        if (kochen.length) todos.push(t('todoCook', { list: kochen.join(' und ') }));
      });
      CONFIG.salatrunden.forEach(function (r) {
        if (r.tag === tag) todos.push(t('todoSalad', { n: CONFIG.mittagMuster.filter(function (s) { return s === r.slot; }).length }));
      });
      rows += '<tr><td><strong>' + esc(tage[tag]) + '</strong> ' + esc(datumKurz(addDays(montag, tag))) + '</td>' +
        '<td>' + (m ? esc(d[m].name) + '<br><small>' + esc(t('toppingIdea', { list: toppings(plan.seed, tag).join(', ') })) + '</small>' : esc(t('free'))) + '</td>' +
        '<td>' + (a ? '<strong>' + esc(a) + '</strong> ' + esc(d[a].name) : esc(t('free'))) + '</td>' +
        '<td>' + esc(todos.join(', ')) + '</td></tr>';
    }
    const gerichte = ABEND_SLOTS.map(function (s) {
      const rest = d[s].einAbend ? 0 : restPortionen(s);
      return '<li><strong>' + esc(s) + '</strong> ' + esc(d[s].name) + ': ' + esc(d[s].zutaten.join(', ')) +
        (rest > 0 ? ' <small>(' + esc(t('rest', { n: rest })) + ')</small>' : '') + '</li>';
    }).concat(MITTAG_SLOTS.map(function (s, i) {
      return '<li><strong>' + esc(t('salad', { n: i + 1 })) + '</strong> ' + esc(d[s].name) + ': ' + esc(d[s].zutaten.join(', ')) + '</li>';
    })).join('');
    const b = bewerte(plan, hist, null);
    ref('print').innerHTML =
      '<h1>' + esc(t('title')) + '</h1>' +
      '<p class="wpl-sub">' + esc(t('weekRange', { von: datumKurz(montag), bis: datumKurz(addDays(montag, 6)) })) + '</p>' +
      '<table class="wpl-ptable"><thead><tr><th>' + esc(t('pDay')) + '</th><th>' + esc(t('lunch')) + '</th><th>' + esc(t('dinner')) + '</th><th>' + esc(t('pPrep')) + '</th></tr></thead>' +
      '<tbody>' + rows + '</tbody></table>' +
      '<h2>' + esc(t('pDishes')) + '</h2><ul class="wpl-plist">' + gerichte + '</ul>' +
      '<p>' + esc(t('pVariety', { g: b.gruppen.length, b: b.beilagen.length, p: b.pflanzen.length, k: b.kuechen.length })) + '</p>' +
      (CONFIG.showDisclaimer ? '<p class="wpl-footer">' + esc(t('disclaimer')) + '</p>' : '');
  }

  function renderWarnings() {
    const d = resolve(aktuellerPlan());
    const w = frischeWarnungen();
    ref('warn').innerHTML = w.map(function (x) {
      return '<p class="wpl-warn">' + esc(t('freshWarn', { name: d[x.slot].name, n: x.tage })) + '</p>';
    }).join('');
  }

  function render() {
    const plan = aktuellerPlan();
    const d = resolve(plan);
    const hist = historie(state.wochen, zielKey);
    const montag = keyToDate(zielKey);
    ref('range').textContent = t('weekRange', { von: datumKurz(montag), bis: datumKurz(addDays(montag, 6)) });
    renderWarnings();
    renderWeek(plan, d);
    renderDishes(plan, d, hist);
    renderCheck(plan, hist);
    renderAll();
    renderPrint(plan, d, hist);
  }

  function showStatus(message, opts) {
    opts = opts || {};
    const box = ref('status');
    clearTimeout(undoTimer);
    box.textContent = '';
    const span = document.createElement('span');
    span.textContent = message;
    box.appendChild(span);
    if (opts.undo) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.dataset.action = 'undo';
      btn.textContent = t('undo');
      box.appendChild(btn);
    }
    box.classList.add('is-visible');
    if (!opts.sticky) {
      undoTimer = setTimeout(function () {
        box.classList.remove('is-visible');
        box.textContent = '';
        undoSnapshot = null;
      }, CONFIG.undoSeconds * 1000);
    }
  }

  // Jede Änderung läuft hier durch: Schnappschuss für Rückgängig, speichern, neu zeichnen
  function commit(mutate, message) {
    undoSnapshot = clone(state);
    mutate();
    storage.save(state);
    render();
    showStatus(message, { undo: true });
  }

  // Alte Wochen über die Historie hinaus wegräumen, damit der Speicher klein bleibt
  function prune() {
    const keys = Object.keys(state.wochen).sort();
    while (keys.length > CONFIG.historieWochen + 1) delete state.wochen[keys.shift()];
  }

  function doReroll() {
    commit(function () {
      state.wochen[zielKey] = erzeugePlan(aktuellerPlan(), historie(state.wochen, zielKey), Math.random, state.favoriten);
    }, t('rerolled'));
  }

  function doLock(slot) {
    const plan = aktuellerPlan();
    const name = resolve(plan)[slot].name;
    const jetzt = !plan.locks[slot];
    commit(function () { aktuellerPlan().locks[slot] = jetzt; }, t(jetzt ? 'lockedMsg' : 'unlockedMsg', { name: name }));
  }

  function doSwap(slot) {
    const plan = aktuellerPlan();
    if (plan.locks[slot]) return;
    const neu = tausche(plan, slot, historie(state.wochen, zielKey), Math.random, state.favoriten);
    if (!neu) return;
    const alt = resolve(plan)[slot].name;
    commit(function () { state.wochen[zielKey] = neu; }, t('swapped', { alt: alt, neu: resolve(neu)[slot].name }));
  }

  // Favorit an- oder abwählen. Der Plan bleibt, wirkt erst beim nächsten Würfeln oder Tauschen.
  function doFav(id) {
    const d = findDish(DATEN.abend, id) || findDish(DATEN.mittag, id);
    if (!d) return;
    const aktiv = state.favoriten.indexOf(id) !== -1;
    commit(function () {
      state.favoriten = aktiv ? state.favoriten.filter(function (x) { return x !== id; }) : state.favoriten.concat(id);
    }, t(aktiv ? 'favMsgOff' : 'favMsgOn', { name: d.name }));
  }

  function doUndo() {
    if (!undoSnapshot) return;
    state = undoSnapshot;
    undoSnapshot = null;
    storage.save(state);
    render();
    showStatus(t('undone'));
  }

  function onClick(e) {
    const btn = e.target.closest('[data-action]');
    if (!btn || !root.contains(btn) || btn.disabled) return;
    const slot = btn.dataset.slot;
    switch (btn.dataset.action) {
      case 'reroll': doReroll(); break;
      case 'lock':   doLock(slot); break;
      case 'swap':   doSwap(slot); break;
      case 'undo':   doUndo(); break;
      case 'fav':    doFav(btn.dataset.id); break;
      case 'print':  window.print(); break;
    }
  }

  function init() {
    try {
      state = storage.load();
      zielKey = dateKey(zielMontag(new Date(), CONFIG.naechsteWocheAbTag));
      // Sofort startklar: Gibt es für diese Woche noch keinen Plan, wird einer gebaut
      if (!state.wochen[zielKey]) {
        state.wochen[zielKey] = erzeugePlan(null, historie(state.wochen, zielKey), Math.random, state.favoriten);
        prune();
        storage.save(state);
      }
      buildSkeleton();
      root.addEventListener('click', onClick);
      render();
      if (!storage.available) showStatus(t('storageOff'), { sticky: true });
    } catch (err) {
      console.error(err);
      root.textContent = t('fatal');
    }
  }

  // Nur für automatische Tests: macht die reinen Funktionen von außen prüfbar
  if (window.__WPL_TEST__) {
    window.__WPL_TEST__.api = { CONFIG: CONFIG, DATEN: DATEN, bewerte: bewerte, erzeugePlan: erzeugePlan, tausche: tausche,
      zielMontag: zielMontag, migrate: migrate, wochenAbstand: wochenAbstand, historie: historie, frischeWarnungen: frischeWarnungen, sanitize: sanitize };
  }

  init();
})();
</script>
